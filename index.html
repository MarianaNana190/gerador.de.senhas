<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerador de Senhas</title>

    <!-- Conectando o CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto&family=Roboto+Mono&display=swap" rel="stylesheet">
</head>

<body>

    <section class="conteudo">

        <div class="conteudo-titulo">

            <img src="" alt="Imagem de cadeado">

            <h2 class="titulo-principal">
                Gerador de Senhas
            </h2>

            <h3 class="titulo-secundario">
                Gere senhas aleatórias e seguras para minha mamãe
            </h3>

        </div>

        <div class="conteudo-senha">

            <label for="campo-senha">Senha</label>

            <input
                name="Senha"
                type="text"
                id="campo-senha"
            >

        </div>

        <div class="parametro">

            <h3 class="parametro-title">
                Personalize a senha de sua mamãe
            </h3>

            <div class="parametro-coluna__senha">

                <!-- Número de caracteres -->
                <div class="parametro-senha">

                    <h4 class="parametro-senha__title">
                        Número de Caracteres
                    </h4>

                    <div class="parametro-senha-botoes">

                        <button class="parametro-senha__botao">
                            -
                        </button>

                        <p class="parametro-senha__text">
                            12
                        </p>

                        <button class="parametro-senha__botao">
                            +
                        </button>

                    </div>

                </div>

                <!-- Características da senha -->
                <div class="parametro-senha">

                    <h4 class="parametro-senha__title">
                        Características da Senha
                    </h4>

                    <div class="parametro-senha__checkbox">

                        <input
                            id="maiusculo"
                            name="maiusculo"
                            type="checkbox"
                        >

                        <label for="maiusculo">
                            Letras Maiúsculas
                        </label>

                    </div>

                    <div class="parametro-senha__checkbox">

                        <input
                            id="minusculo"
                            name="minusculo"
                            type="checkbox"
                            checked
                        >

                        <label for="minusculo">
                            Letras Minúsculas
                        </label>

                    </div>

                    <div class="parametro-senha__checkbox">

                        <input
                            id="numero"
                            name="numero"
                            type="checkbox"
                            checked
                        >

                        <label for="numero">
                            Números
                        </label>

                    </div>

                    <div class="parametro-senha__checkbox">

                        <input
                            id="simbolo"
                            name="simbolo"
                            type="checkbox"
                            checked
                        >

                        <label for="simbolo">
                            Símbolos
                        </label>

                    </div>

                </div>

                <!-- Força da senha -->
                <div class="parametro-senha">

                    <h4 class="parametro-senha__title">
                        Força da Senha
                    </h4>

                    <div class="barra">

                        <div class="forca fraca"></div>

                    </div>

                    <div class="parametro-senha-text">

                        <p>Fraca</p>
                        <p>Média</p>
                        <p>Forte</p>

                    </div>

                    <p class="entropia"></p>

                </div>

            </div>

        </div>

    </section>

    <!-- Conectando o JavaScript -->
    <script src="main.js"></script>

</body>

</html>
